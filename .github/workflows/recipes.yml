name: Recipes

# Validate recipe overlay changes against the renderer that publishes them
# (recipes.vllm.ai): each overlay is merged into the vLLM recipe it extends,
# with the same scope rules and JSON API build that run when
# vllm-project/recipes picks up this directory after merge.

on:
  pull_request:
    paths:
      - 'recipes/**'
      - '.github/workflows/recipes.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Recipes
    if: github.repository_owner == 'vllm-project'
    uses: vllm-project/recipes/.github/workflows/validate-recipes.yml@main
    with:
      source: vllm-ascend
      path: recipes
