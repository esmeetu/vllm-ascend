# Ascend content for zai-org/GLM-5.3, merged by recipes.vllm.ai into the core recipe
# in vllm-project/vllm (recipes/models/zai-org/GLM-5.3.yaml).

meta:
  hardware:
    # Validated 2026-08-30 on one Atlas A5 node (8×950PR, TP8, graph mode).
    # Native FP8 path needs vllm-ascend#15346.
    ascend_950pr_8x: verified
features:
  spec_decoding:
    modes:
      mtp:
        hardware_overrides:
          npu:
            args:
              - "--speculative-config"
              - '{"method":"mtp","num_speculative_tokens":1,"enforce_eager":true}'
      dflash:
        hardware:
          npu: unsupported
variants:
  default:
    hardware_overrides:
      # Exact-GPU pin: computeDockerMeta has no Huawei brand, so a model-level
      # docker_image string would only affect NVIDIA. Hide pip — official
      # wheels have no NPU kernels.
      ascend_950pr_8x:
        docker_image: "quay.io/ascend/vllm-ascend:nightly-main-a5"
        install:
          pip: false

# EP/MC2 cannot acquire HCCL links on Atlas 350 (950PR). Multi-node and PD
# were not validated. Only single-node TP8 is offered on NPU.
strategy_hardware:
  single_node_tep:
    npu: unsupported
  multi_node_tp:
    npu: unsupported
  multi_node_tp_pp:
    npu: unsupported
  multi_node_tep:
    npu: unsupported
  multi_node_dep:
    npu: unsupported
  pd_cluster:
    npu: unsupported
hardware_overrides:
  # Shared by 950PR 8x (8×128 GB). last-wins shadows --kv-cache-dtype fp8_e4m3
  # from base_args; SFA on 950 needs --block-size 512.
  npu:
    extra_args:
      - "--trust-remote-code"
      - "--kv-cache-dtype"
      - "auto"
      - "--block-size"
      - "512"
      - "--max-model-len"
      - "131072"
      - "--max-num-seqs"
      - "16"
      - "--gpu-memory-utilization"
      - "0.9"
    extra_env:
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      OMP_PROC_BIND: "false"
      OMP_NUM_THREADS: "1"
      TASK_QUEUE_ENABLE: "1"
      HCCL_BUFFSIZE: "1024"
      HCCL_OP_EXPANSION_MODE: "AIV"
hardware_notes:
  ascend_950pr_8x:
    title: "vLLM Ascend A5 image required"
    body: "Single-node TP8 on 8×950PR. Pin quay.io/ascend/vllm-ascend:nightly-main-a5 and overlay vllm-ascend#15346 for native FP8. EP is not available on this interconnect. Set HCCL_BUFFSIZE=1024 before launch."
