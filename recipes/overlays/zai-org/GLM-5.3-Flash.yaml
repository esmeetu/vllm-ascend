# Ascend content for zai-org/GLM-5.3-Flash, merged by recipes.vllm.ai into the core recipe
# in vllm-project/vllm (recipes/models/zai-org/GLM-5.3-Flash.yaml).

meta:
  hardware:
    ascend_950pr_8x: verified
variants:
  default:
    hardware_overrides:
      ascend_950pr_8x:
        docker_image: "quay.io/ascend/vllm-ascend:nightly-main-a5"
        install:
          pip: false

strategy_hardware:
  single_node_tep:
    npu: unsupported
  single_node_dep:
    npu: unsupported
  multi_node_tp:
    npu: unsupported
  multi_node_tp_pp:
    npu: unsupported
  multi_node_tep:
    npu: unsupported
  multi_node_dep:
    npu: unsupported
  pd_cluster:
    npu: unsupported
hardware_overrides:
  # Shared by 950PR 8x (8×128 GB). SFA / kpool indexer needs --block-size 512.
  npu:
    extra_args:
      - "--trust-remote-code"
      - "--block-size"
      - "512"
      - "--max-model-len"
      - "131072"
      - "--max-num-seqs"
      - "16"
      - "--max-num-batched-tokens"
      - "8192"
      - "--gpu-memory-utilization"
      - "0.90"
    extra_env:
      PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
      HCCL_BUFFSIZE: "512"
      HCCL_OP_EXPANSION_MODE: "AIV"
      HCCL_CONNECT_TIMEOUT: "7200"
hardware_notes:
  ascend_950pr_8x:
    title: "vLLM Ascend A5 image required"
    body: "Single-node TP8 on 8×950PR. Pin quay.io/ascend/vllm-ascend:nightly-main-a5 and overlay vLLM#53906 / vllm-ascend#15127. Do not pass --quantization ascend. --block-size 512 is required (kpool indexer). EP is not available on this interconnect."
